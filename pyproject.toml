[project]
name = "aoc2016"
version = "0.1.0"
description = "Advent of Code 2016"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pythonturtle>=0.3.2", "regex>=2026.9.3", "rich>=14.2.0"]

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.15.10", "ty>=0.0.29"]

# Здесь регистрируются исполняемые файлы
[project.scripts]
# команда = "путь.к.пакету.модуль:функция"
day01 = "aoc2016.day01:main"
day02 = "aoc2016.day02:main"
day03 = "aoc2016.day03:main"
day04 = "aoc2016.day04:main"
day05 = "aoc2016.day05:main"
day06 = "aoc2016.day06:main"
day07 = "aoc2016.day07:main"
day08 = "aoc2016.day08:main"
day09 = "aoc2016.day09:main"
day10 = "aoc2016.day10:main"
day11 = "aoc2016.day10:main"
day12 = "aoc2016.day12:main"
day13 = "aoc2016.day13:main"
day14 = "aoc2016.day14:main"
day15 = "aoc2016.day15:main"
day16 = "aoc2016.day16:main"
day17 = "aoc2016.day17:main"
day18 = "aoc2016.day18:main"
day20 = "aoc2016.day20:main"
day21 = "aoc2016.day21:main"

[tool.uv]
# Важно! uv работает с пакетом, а не с набором файлов
package = true


[tool.ruff]

# Same as Black.
line-length = 160
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# select = ["E4", "E7", "E9", "F"]
select = ["ALL"]
ignore = [
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "D203",
    "D213",
    "RET505",
    "CPY001",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
